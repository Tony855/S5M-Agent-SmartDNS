name: DNS bootstrap template validation

on:
  pull_request:
    branches: [main]
    paths:
      - "s5m-agent/default-config.yaml"
      - "s5m-agent/smartdns/default-config-smartdns.yaml"
      - "s5m-agent/smartdns/smartdns.conf"
      - ".github/workflows/dns-bootstrap-templates.yml"
  push:
    branches: [main]
    paths:
      - "s5m-agent/default-config.yaml"
      - "s5m-agent/smartdns/default-config-smartdns.yaml"
      - "s5m-agent/smartdns/smartdns.conf"
      - ".github/workflows/dns-bootstrap-templates.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate encrypted DNS defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Mihomo bootstrap resolvers
        shell: bash
        run: |
          set -euo pipefail
          # SmartDNS-enabled images use encrypted DNS bootstrap resolvers.
          config=s5m-agent/smartdns/default-config-smartdns.yaml
          grep -Fqx '    - tls://223.5.5.5' "$config"
          grep -Fqx '    - tls://223.6.6.6' "$config"
          ! grep -Fqx '    - 223.5.5.5' "$config"
          ! grep -Fqx '    - 119.29.29.29' "$config"

          # SmartDNS-free images (including RouterOS) must not reference the
          # absent local resolver; literal bootstrap IPs avoid DNS recursion.
          for config in s5m-agent/default-config.yaml s5m-agent/default-config-no-smartdns.yaml; do
            grep -Fqx '    - 223.5.5.5' "$config"
            grep -Fqx '    - 223.6.6.6' "$config"
            ! grep -Eq '127\.0\.0\.1:605[34]' "$config"
          done
      - name: Validate SmartDNS encrypted upstreams and private listeners
        shell: bash
        run: |
          set -euo pipefail
          config=s5m-agent/smartdns/smartdns.conf
          grep -Fqx 'bind 127.0.0.1:6053' "$config"
          grep -Fqx 'bind-tcp 127.0.0.1:6053' "$config"
          grep -Fqx 'server-tls [2606:4700:4700::1111]:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com' "$config"
          grep -Fqx 'server-tls [2001:4860:4860::8888]:853 -host-name dns.google -tls-host-verify dns.google' "$config"
          ! grep -Eq '^[[:space:]]*server(-tcp)?[[:space:]]' "$config"
          ! grep -E '^[[:space:]]*server-tls[[:space:]]' "$config" | grep -Ev -- '-host-name [^[:space:]]+.*-tls-host-verify [^[:space:]]+'
