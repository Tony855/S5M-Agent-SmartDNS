name: Import S5M-Server source archive

on:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/import-server-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-server-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s source.zip
          # Validate archive paths, file types, and expansion limits before extraction.
          python3 - <<'PY'
          import pathlib
          import stat
          import zipfile

          archive = zipfile.ZipFile("source.zip")
          infos = archive.infolist()
          if not infos or len(infos) > 10000:
              raise SystemExit("source.zip has an invalid entry count")
          total = 0
          seen = set()
          for info in infos:
              name = info.filename
              path = pathlib.PurePosixPath(name)
              if "\\\\" in name or path.is_absolute() or any(part in ("", ".", "..") for part in path.parts):
                  raise SystemExit(f"unsafe archive path: {name!r}")
              if path.parts[0] != "source":
                  raise SystemExit(f"unexpected archive root: {name!r}")
              normalized = str(path)
              if normalized in seen:
                  raise SystemExit(f"duplicate archive path: {name!r}")
              seen.add(normalized)
              mode = (info.external_attr >> 16) & 0xFFFF
              kind = stat.S_IFMT(mode)
              if kind not in (0, stat.S_IFREG, stat.S_IFDIR):
                  raise SystemExit(f"non-regular archive entry: {name!r}")
              if info.file_size > 25 * 1024 * 1024:
                  raise SystemExit(f"archive entry too large: {name!r}")
              total += info.file_size
              if total > 150 * 1024 * 1024:
                  raise SystemExit("source.zip expands beyond 150 MiB")
          archive.extractall("/tmp/s5m-server-import")
          PY
          test -d /tmp/s5m-server-import/source
          test -f /tmp/s5m-server-import/source/main.go
          test -f /tmp/s5m-server-import/source/go.mod
          test -d /tmp/s5m-server-import/source/internal
          test -d /tmp/s5m-server-import/source/web
          rm -rf server
          mkdir -p server
          cp -a /tmp/s5m-server-import/source/. server/
          test -f server/main.go
          test -f server/go.mod
          echo "Imported $(find server -type f | wc -l) files into server/"

      - name: Verify Go source
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test and build S5M-Server
        working-directory: server
        run: |
          set -Eeuo pipefail
          go mod download
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/S5M-Server .

      - name: Commit extracted source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "CI: import S5M-Server source archive"
          git push origin HEAD:main
