name: Import S5M-Server source archive

on:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/import-server-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-server-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check whether a source archive is available
        id: archive
        shell: bash
        run: |
          if [[ -s source.zip ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No source.zip is present; skipping source import."
          fi

      - name: Validate and extract archive
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s source.zip
          # Validate archive paths, file types, and expansion limits before extraction.
          python3 scripts/tests/test-source-archive-validation.py
          rm -rf /tmp/s5m-server-import
          python3 scripts/validate-source-archive.py source.zip /tmp/s5m-server-import
          test -d /tmp/s5m-server-import/source
          test -f /tmp/s5m-server-import/source/main.go
          test -f /tmp/s5m-server-import/source/go.mod
          test -d /tmp/s5m-server-import/source/internal
          test -d /tmp/s5m-server-import/source/web
          rm -rf server
          mkdir -p server
          cp -a /tmp/s5m-server-import/source/. server/
          test -f server/main.go
          test -f server/go.mod
          echo "Imported $(find server -type f | wc -l) files into server/"

      - name: Verify Go source
        if: steps.archive.outputs.present == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test and build S5M-Server
        if: steps.archive.outputs.present == 'true'
        working-directory: server
        run: |
          set -Eeuo pipefail
          go mod download
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/S5M-Server .

      - name: Commit extracted source
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "CI: import S5M-Server source archive"
          git push origin HEAD:main
