name: Installer Validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - ".github/workflows/installer-validation.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - ".github/workflows/installer-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-installer:
    name: Validate install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n scripts/install.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck errors
        run: shellcheck --severity=error scripts/install.sh
