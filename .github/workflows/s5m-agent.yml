name: S5M Agent without SmartDNS

concurrency:
  group: no-smartdns-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "s5m-agent/Dockerfile"
      - "s5m-agent/*.go"
      - "s5m-agent/go.mod"
      - "s5m-agent/go.sum"
      - "s5m-agent/healthcheck-no-smartdns.sh"
      - "s5m-agent/default-config-no-smartdns.yaml"
      - "s5m-agent/services/**"
      - "s5m-agent/cont-init.d/**"
      - ".github/workflows/s5m-agent.yml"
  push:
    branches: [main]
    paths:
      - "s5m-agent/Dockerfile"
      - "s5m-agent/*.go"
      - "s5m-agent/go.mod"
      - "s5m-agent/go.sum"
      - "s5m-agent/healthcheck-no-smartdns.sh"
      - "s5m-agent/default-config-no-smartdns.yaml"
      - "s5m-agent/services/**"
      - "s5m-agent/cont-init.d/**"
      - ".github/workflows/s5m-agent.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish only after production validation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tony855/s5m-agent

jobs:
  test:
    name: Build and runtime smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: no-smartdns:amd64
            runner_arch: amd64
          - platform: linux/arm64
            tag: no-smartdns:arm64
            runner_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-SmartDNS healthcheck shell syntax
        run: sh -n s5m-agent/healthcheck-no-smartdns.sh

      - name: Test Mihomo persistent-volume initialization safety
        run: sh s5m-agent/tests/mihomo-init-safety.sh
      - name: Run Agent unit tests
        run: |
          cd s5m-agent
          go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
      - name: Verify no-SmartDNS image runtime
        shell: bash
        run: |
          set -euo pipefail
          name="s5m-no-smartdns-${{ matrix.runner_arch }}"
          data="$(mktemp -d)"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; if [[ -n "${legacy_name:-}" ]]; then docker rm -f "$legacy_name" >/dev/null 2>&1 || true; fi; sudo rm -rf "$data" "${legacy_data:-}"; }
          trap cleanup EXIT
          sudo modprobe tun || true
          if [[ ! -c /dev/net/tun ]]; then sudo mkdir -p /dev/net; sudo mknod /dev/net/tun c 10 200; sudo chmod 600 /dev/net/tun; fi
          docker run -d --name "$name" --platform "${{ matrix.platform }}" --restart no --cap-add=NET_ADMIN --device=/dev/net/tun:/dev/net/tun -p 127.0.0.1::80/tcp -v "$data:/data" "${{ matrix.tag }}" >/dev/null
          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$name")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$name")"
            [[ "$state" == running ]] || { docker logs "$name"; exit 1; }
            [[ "$health" == healthy ]] && break
            sleep 2
          done
          if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" != healthy ]]; then docker inspect --format '{{json .State.Health}}' "$name"; docker logs "$name"; docker exec "$name" /healthcheck.sh || true; exit 1; fi
          docker exec "$name" pidof mihomo
          docker exec "$name" /healthcheck.sh
          docker exec "$name" sh -ec 'test ! -e /usr/sbin/smartdns; ! pidof smartdns; ! grep -Eq "6053|6054|smartdns" /app/default-config.yaml; grep -q "127.0.0.1:5353" /app/default-config.yaml'
          if docker port "$name" 8088/tcp 2>/dev/null | grep -q .; then echo "Mihomo controller API 8088 must not be published" >&2; exit 1; fi
          # Upgrade-path smoke: seed an old SmartDNS config and prove startup
          # migrates DNS only while preserving identity, proxy and custom rules.
          legacy_name="${name}-legacy"
          legacy_data="$(mktemp -d)"
          cat > "$legacy_data/config.yaml" <<'YAML'
          secret: keep-existing-agent-secret
          allow-lan: true
          mode: rule
          ipv6: false
          external-controller: 127.0.0.1:8088
          dns:
            enable: true
            ipv6: false
            listen: 127.0.0.1:5353
            nameserver:
              - 127.0.0.1:6053
            nameserver-policy:
              "geosite:cn": 127.0.0.1:6054
              "+.internal.example": 192.0.2.53
            fallback:
              - https://dns.cloudflare.com/dns-query
          proxies:
            - name: preserved-node
              type: socks5
              server: 192.0.2.10
              port: 1080
          proxy-groups: []
          rules:
            - DOMAIN-SUFFIX,v2net.cc,DIRECT
            - DOMAIN-SUFFIX,custom.example,DIRECT
            - MATCH,DIRECT
          tun:
            enable: false
          YAML
          docker run -d --name "$legacy_name" --platform "${{ matrix.platform }}" --restart no --cap-add=NET_ADMIN --device=/dev/net/tun:/dev/net/tun -p 127.0.0.1::80/tcp -v "$legacy_data:/data" "${{ matrix.tag }}" >/dev/null
          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Status}}' "$legacy_name")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$legacy_name")"
            [[ "$state" == running ]] || { docker logs "$legacy_name"; exit 1; }
            [[ "$health" == healthy ]] && break
            sleep 2
          done
          if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$legacy_name")" != healthy ]]; then docker inspect --format '{{json .State.Health}}' "$legacy_name"; docker logs "$legacy_name"; docker exec "$legacy_name" /healthcheck.sh || true; exit 1; fi
          test -s "$legacy_data/config.yaml.pre-no-smartdns"
          grep -q 'keep-existing-agent-secret' "$legacy_data/config.yaml"
          grep -q 'preserved-node' "$legacy_data/config.yaml"
          grep -q 'custom.example' "$legacy_data/config.yaml"
          grep -q '192.0.2.53' "$legacy_data/config.yaml"
          ! grep -Eq '127.0.0.1:6053|127.0.0.1:6054' "$legacy_data/config.yaml"
          docker rm -f "$legacy_name" >/dev/null
          sudo rm -rf "$legacy_data"


  publish:
    name: Publish multi-architecture no-SmartDNS image (manual opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64 + ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: s5m-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=S5M Agent without SmartDNS
            org.opencontainers.image.source=https://github.com/Tony855/S5M-Agent-SmartDNS
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      # A successful authenticated push does not prove that Docker hosts can
      # pull the package anonymously. Use an isolated empty Docker config so
      # cached runner credentials cannot hide a private-package regression.
      - name: Verify anonymous GHCR pull and multi-architecture manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          cleanup() { rm -rf "$anonymous_config"; }
          trap cleanup EXIT
          export DOCKER_CONFIG="$anonymous_config"

          docker buildx imagetools inspect --raw "$IMAGE_NAME:dev" |
            jq -e '
              [.manifests[]?.platform
                | select(.os == "linux")
                | .architecture] as $architectures
              | ($architectures | index("amd64") != null)
                and ($architectures | index("arm64") != null)
            ' >/dev/null

          docker pull "$IMAGE_NAME:dev"
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
