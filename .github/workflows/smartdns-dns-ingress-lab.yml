name: SmartDNS DNS ingress source-IP lab

on:
  pull_request:
    paths:
      - "scripts/lab/smartdns-dns-ingress/**"
      - "scripts/host-ingress/**"
      - ".github/workflows/smartdns-dns-ingress-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-source-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate physical LAN probe tooling
        run: |
          bash -n scripts/lab/smartdns-dns-ingress/physical-lan-capture.sh
          python3 -m py_compile scripts/lab/smartdns-dns-ingress/physical-client-probe.py
          python3 -m unittest discover -s scripts/lab/smartdns-dns-ingress -p 'test_*.py'
          rm -rf scripts/lab/smartdns-dns-ingress/__pycache__
      - name: Validate restricted host ingress controller
        run: |
          python3 -m py_compile scripts/host-ingress/controller.py
          python3 -m unittest discover -s scripts/host-ingress -p 'test_*.py'
          bash -n scripts/host-ingress/install-host-controller.sh
          systemd-analyze verify scripts/host-ingress/s5m-agent-ingress.service scripts/host-ingress/s5m-agent-ingress.timer
          rm -rf scripts/host-ingress/__pycache__
      - name: Run isolated Docker source-IP experiment
        run: |
          bash scripts/lab/smartdns-dns-ingress/run.sh
          sudo bash scripts/lab/smartdns-dns-ingress/run-routed.sh
