name: SmartDNS multi-arch image

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/smartdns/**"
      - "scripts/tests/verify-smartdns-source-pin.sh"
      - ".github/workflows/smartdns-image.yml"
  push:
    branches: [main]
    tags:
      - "smartdns-v*"
    paths:
      - "docker/smartdns/**"
      - "scripts/tests/verify-smartdns-source-pin.sh"
      - ".github/workflows/smartdns-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish multi-architecture image to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tony855/s5m-smartdns
  SMARTDNS_COMMIT: 21c940edc65520849ba03544c5cf8d9cf326e680

jobs:
  test:
    name: Build and smoke-test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify immutable SmartDNS source pin
        run: bash scripts/tests/verify-smartdns-source-pin.sh

      - name: Install DNS test client
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Build test image
        run: |
          docker build --platform linux/amd64 \
            --build-arg "SMARTDNS_COMMIT=$SMARTDNS_COMMIT" \
            -f docker/smartdns/Dockerfile \
            -t smartdns:test docker/smartdns

      - name: Test UDP and TCP DNS
        run: sh docker/smartdns/tests/smoke-test.sh smartdns:test

  test-arm64:
    name: Build and smoke-test (linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install DNS test client
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Build ARM64 test image
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg "SMARTDNS_COMMIT=$SMARTDNS_COMMIT" \
            -f docker/smartdns/Dockerfile \
            -t smartdns:arm64 docker/smartdns

      - name: Test UDP and TCP DNS on ARM64
        run: sh docker/smartdns/tests/smoke-test.sh smartdns:arm64

  publish:
    name: Publish linux/amd64 and linux/arm64 to GHCR
    needs: [test, test-arm64]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=smartdns-v(.*),group=1
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/smartdns
          file: docker/smartdns/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SMARTDNS_COMMIT=${{ env.SMARTDNS_COMMIT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
