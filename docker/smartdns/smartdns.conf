# S5M SmartDNS container defaults.
# The container listens on DNS port 53. Publish it on a host-local port
# (for example 127.0.0.1:6053:53/udp and /tcp) unless public access is intended.
bind 0.0.0.0:53
bind-tcp 0.0.0.0:53

# Upstream resolvers. Replace these with your preferred reachable resolvers.
server 223.5.5.5
server 119.29.29.29

# Cache and logging
cache-size 16384
prefetch-domain yes
serve-expired yes
log-level info
log-console yes
log-syslog no
