services:
  s5m-agent:
    image: ghcr.io/tony855/s5m-agent-smartdns:dev
    container_name: s5m-agent
    restart: unless-stopped
    environment:
      # Pass the host OS hostname; otherwise Docker may expose the container ID.
      S5M_HOSTNAME: ${S5M_HOSTNAME:-}
    ports:
      - "80:80"
      - "7890:7890"
    volumes:
      - ./data:/data
    # TUN is disabled in the default config. Add docker-compose.tun.yml only
    # when the operator explicitly enables TUN in /data/config.yaml.
