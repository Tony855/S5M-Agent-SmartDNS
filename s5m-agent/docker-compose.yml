services:
  s5m-agent:
    image: ghcr.io/tony855/s5m-agent-smartdns:dev
    container_name: s5m-agent
    restart: unless-stopped
    environment:
      # Pass the host OS hostname; otherwise Docker may expose the container ID.
      S5M_HOSTNAME: ${S5M_HOSTNAME:-}
    ports:
      - "80:80"
    volumes:
      - ./data:/data
    # Default container has no NET_ADMIN capability or TUN device.
    # Add docker-compose.tun.yml only when tun.enable is explicitly true.
