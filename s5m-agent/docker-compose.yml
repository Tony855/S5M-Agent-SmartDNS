services:
  s5m-agent:
    image: ghcr.io/tony855/s5m-agent-smartdns:dev
    container_name: s5m-agent
    restart: unless-stopped
    environment:
      # Pass the host OS hostname; otherwise Docker may expose the container ID.
      S5M_HOSTNAME: ${S5M_HOSTNAME:-}
    ports:
      - "80:80"
    volumes:
      - ./data:/data
    # TUN is enabled by default in generated node configs; grant the required
    # capability and device in the Agent container network namespace.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
