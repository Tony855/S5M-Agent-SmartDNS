# S5M Agent default config with local SmartDNS as the primary DNS resolver.
# Existing /data/config.yaml is intentionally preserved by the init script.
allow-lan: true
mode: rule
log-level: info
find-process-mode: strict
ipv6: true

external-controller: 127.0.0.1:8088
secret: __S5M_GENERATED_SECRET__

profile:
  store-selected: true
  # Persist Fake-IP <-> domain mappings only; DNS answer caching belongs to SmartDNS.
  store-fake-ip: true

dns:
  ipv6: true
  # SmartDNS is the single DNS-answer cache (cache/prefetch/serve-expired).
  # Mihomo keeps only Fake-IP mapping state via profile.store-fake-ip above.
  enable: true
  listen: 127.0.0.1:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - "*.lan"
    - "+.v2net.cc"
  # Bootstrap and proxy-node hostname lookups use literal-IP resolvers to avoid loops.
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  proxy-server-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  nameserver:
    - 127.0.0.1:6053
  nameserver-policy:
    "geosite:cn": 127.0.0.1:6054

proxies: []
proxy-groups: []

rules:
  - DOMAIN-SUFFIX,v2net.cc,DIRECT
  - MATCH,DIRECT

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
