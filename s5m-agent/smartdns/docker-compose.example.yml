services:
  s5m-agent-smartdns:
    image: ghcr.io/tony855/s5m-agent-smartdns:dev
    container_name: s5m-agent-smartdns
    restart: unless-stopped
    environment:
      S5M_HOSTNAME: ${S5M_HOSTNAME:-}
    ports:
      - "80:80"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
    # SmartDNS port 6053 and Mihomo's local control API are internal and are not published.
    # Transparent proxying uses TUN; keep bridge networking when TUN is enabled.
