# SmartDNS is private to this container unless the operator explicitly publishes 6053.
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053
# Dedicated domestic resolver listener: only the china-dot upstream group.
bind 127.0.0.1:6054 -group china-dot
bind-tcp 127.0.0.1:6054 -group china-dot

# Dual-stack DoT pools. Keep both address families so IPv4-only, IPv6-only,
# and dual-stack proxy egress can use endpoints reachable through that egress.
# SOCKS5 server ingress remains unchanged; only the remote DoT destination varies.
# Literal IPs avoid bootstrap loops; TLS SNI and certificate verification stay enabled.
# Shared mode: PROCESS-NAME can select one shared egress, not per-client egress.
# Per-client routing requires SmartDNS client-IP groups plus named SOCKS proxies.
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com
server-tls [2606:4700:4700::1111]:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com
server-tls 8.8.8.8:853 -host-name dns.google -tls-host-verify dns.google
server-tls [2001:4860:4860::8888]:853 -host-name dns.google -tls-host-verify dns.google

# Domestic-only dual-stack DoT pool; all endpoints stay outside the default group.
server-tls 223.5.5.5:853 -host-name dns.alidns.com -tls-host-verify dns.alidns.com -group china-dot -exclude-default-group
server-tls 223.6.6.6:853 -host-name dns.alidns.com -tls-host-verify dns.alidns.com -group china-dot -exclude-default-group
server-tls [2400:3200::1]:853 -host-name dns.alidns.com -tls-host-verify dns.alidns.com -group china-dot -exclude-default-group
server-tls [2400:3200:baba::1]:853 -host-name dns.alidns.com -tls-host-verify dns.alidns.com -group china-dot -exclude-default-group
server-tls 1.12.12.12:853 -host-name dot.pub -tls-host-verify dot.pub -group china-dot -exclude-default-group
server-tls 120.53.53.53:853 -host-name dot.pub -tls-host-verify dot.pub -group china-dot -exclude-default-group

# Preserve A/AAAA answers without host-side IPv6 reachability filtering.
dualstack-ip-selection no
dualstack-ip-selection-threshold 10
dualstack-ip-allow-force-AAAA yes

cache-size 16384
cache-persist yes
cache-file /data/smartdns.cache
cache-checkpoint-time 3600
prefetch-domain yes
serve-expired yes
log-level info
log-console yes
log-syslog no
