# SmartDNS is private to this container unless the operator explicitly publishes 6053.
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053

# Encrypted DNS-over-TLS upstreams. Literal endpoint IPs avoid bootstrap loops;
# Mihomo routes the SmartDNS process through the selected proxy.
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com
server-tls 8.8.8.8:853 -host-name dns.google

cache-size 16384
prefetch-domain yes
serve-expired yes
log-level info
log-console yes
log-syslog no
