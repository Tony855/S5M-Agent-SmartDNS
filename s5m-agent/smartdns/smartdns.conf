# SmartDNS is private to this container unless the operator explicitly publishes 6053.
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053

# Encrypted DNS-over-TLS upstreams. Literal endpoint IPs avoid bootstrap loops;
# Shared mode only: this single SmartDNS process does not identify individual clients.
# Mihomo PROCESS-NAME rules can select one shared egress, never per-client egress.
# Per-client routing must use SmartDNS client-IP groups plus named SOCKS proxies;
# the Agent currently rejects those directives until runtime support is complete.
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com
server-tls 8.8.8.8:853 -host-name dns.google

cache-size 16384
prefetch-domain yes
serve-expired yes
log-level info
log-console yes
log-syslog no
