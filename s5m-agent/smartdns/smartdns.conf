# SmartDNS is private to this container unless the operator explicitly publishes 6053.
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053

# Upstream DNS servers; use literal IPs to avoid bootstrap loops.
server 223.5.5.5
server 119.29.29.29

cache-size 16384
prefetch-domain yes
serve-expired yes
log-level info
log-console yes
log-syslog no
