# Real SmartDNS daemon integration test; isolated routed Docker bridge only.
bind 172.31.0.10:6055
bind-tcp 172.31.0.10:6055
cache-size 0
speed-check-mode none
log-level info
address /probe.test/192.0.2.99
group-begin client-a
group-match -client-ip 192.168.50.10/32
address /probe.test/192.0.2.10
group-end
group-begin client-b
group-match -client-ip 192.168.50.20/32
address /probe.test/192.0.2.20
group-end
