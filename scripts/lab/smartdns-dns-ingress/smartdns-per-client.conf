# Mirrors the per-client directives emitted by server/internal/app/smartdns_config.go.
# The listener is reachable only through the isolated routed Docker bridge.
bind 172.31.0.10:6055
bind-tcp 172.31.0.10:6055
cache-size 0
speed-check-mode none
log-level info

# SmartDNS must use the real Mihomo per-client SOCKS listeners, not direct
# observer sockets. Each listener is pinned by Mihomo to one outbound proxy.
proxy-server socks5://127.0.0.1:16000 -name s5m-smartdns-16000
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com -group s5m-smartdns-group-16000 -proxy s5m-smartdns-16000 -exclude-default-group
group-begin s5m-smartdns-group-16000
group-match -client-ip 192.168.50.10/32
address /probe-a.test/192.0.2.10
group-end

proxy-server socks5://127.0.0.1:16001 -name s5m-smartdns-16001
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com -group s5m-smartdns-group-16001 -proxy s5m-smartdns-16001 -exclude-default-group
group-begin s5m-smartdns-group-16001
group-match -client-ip 192.168.50.20/32
address /probe-b.test/192.0.2.20
group-end
