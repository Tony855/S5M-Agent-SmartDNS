# Mirrors the per-client directives emitted by server/internal/app/smartdns_config.go.
# The listener is reachable only through the isolated routed Docker bridge.
bind 172.31.0.10:6055
bind-tcp 172.31.0.10:6055
cache-size 0
speed-check-mode none
log-level info

# Each generated listener gets its own named SOCKS proxy and encrypted upstream.
proxy-server socks5://127.0.0.1:19081 -name s5m-smartdns-19081
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com -group s5m-smartdns-group-19081 -proxy s5m-smartdns-19081 -exclude-default-group
group-begin s5m-smartdns-group-19081
group-match -client-ip 192.168.50.10/32
address /probe-a.test/192.0.2.10
group-end

proxy-server socks5://127.0.0.1:19082 -name s5m-smartdns-19082
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -tls-host-verify cloudflare-dns.com -group s5m-smartdns-group-19082 -proxy s5m-smartdns-19082 -exclude-default-group
group-begin s5m-smartdns-group-19082
group-match -client-ip 192.168.50.20/32
address /probe-b.test/192.0.2.20
group-end
